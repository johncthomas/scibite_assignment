[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbpedia-query"
version = "0.1.0"
description = "Answer simple questions about people using DBpedia's SPARQL endpoint"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[tool.setuptools]
py-modules = ["dbpedia_query"]

[project.scripts]
dbpedia-query-test ="dbpedia_query.main:test_do_sparql_query"